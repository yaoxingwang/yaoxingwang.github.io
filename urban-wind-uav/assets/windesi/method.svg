<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">WindESI method overview</title>
  <desc id="desc">WindESI combines geometry, a wind-field prior, an onboard decision model, active measurement, route planning, safety checking, and CFD replay.</desc>
  <defs>
    <marker id="m-blue" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2456d6"/></marker>
    <marker id="m-violet" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#6d3fc0"/></marker>
    <marker id="m-red" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#b3261e"/></marker>
    <filter id="method-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324a" flood-opacity=".11"/></filter>
    <pattern id="method-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e4eaf2" stroke-width="1"/></pattern>
  </defs>

  <rect width="1500" height="820" fill="#f6f8fc"/>
  <rect x="28" y="28" width="1444" height="764" rx="22" fill="#ffffff" stroke="#dde3ee" stroke-width="2" filter="url(#method-shadow)"/>
  <text x="72" y="78" fill="#1a2233" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">WindESI method：先验、测量与安全决策的端侧闭环</text>
  <text x="72" y="110" fill="#5a6478" font-family="Inter, sans-serif" font-size="14">The model chooses what to measure; the planner chooses how to fly; the checker decides whether the action is allowed.</text>
  <text x="1424" y="78" text-anchor="end" fill="#6d3fc0" font-family="ui-monospace, monospace" font-size="13">METHOD / 01</text>

  <g transform="translate(72 158)">
    <rect width="250" height="190" rx="14" fill="#e0f2f4" stroke="#0f7c8c" stroke-width="2"/>
    <text x="24" y="34" fill="#0f7c8c" font-family="ui-monospace, monospace" font-size="12" font-weight="700">INPUT</text>
    <text x="24" y="70" fill="#1a2233" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">场景与任务</text>
    <text x="24" y="102" fill="#4a5672" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14">建筑地图 / 相机视图</text>
    <text x="24" y="128" fill="#4a5672" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14">起点、终点、背景风</text>
    <text x="24" y="154" fill="#4a5672" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14">法规与飞行约束</text>
  </g>
  <path d="M334 254 H382" stroke="#2456d6" stroke-width="3" marker-end="url(#m-blue)"/>

  <g transform="translate(394 158)">
    <rect width="280" height="190" rx="14" fill="#e5edff" stroke="#2456d6" stroke-width="2"/>
    <text x="24" y="34" fill="#2456d6" font-family="ui-monospace, monospace" font-size="12" font-weight="700">PRIOR</text>
    <text x="24" y="70" fill="#1a2233" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">风场先验</text>
    <text x="24" y="103" fill="#4a5672" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14">2D FNO / WindSeer / belief field</text>
    <rect x="24" y="126" width="232" height="38" rx="8" fill="#ffffff" opacity=".78"/>
    <text x="38" y="151" fill="#2456d6" font-family="Inter, sans-serif" font-size="13">mean wind + uncertainty</text>
  </g>
  <path d="M686 254 H734" stroke="#2456d6" stroke-width="3" marker-end="url(#m-blue)"/>

  <g transform="translate(746 158)">
    <rect width="280" height="190" rx="14" fill="#efe7fb" stroke="#6d3fc0" stroke-width="2"/>
    <text x="24" y="34" fill="#6d3fc0" font-family="ui-monospace, monospace" font-size="12" font-weight="700">ONBOARD POLICY</text>
    <text x="24" y="70" fill="#1a2233" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">端侧决策层</text>
    <text x="24" y="103" fill="#4a5672" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14">小模型 + 工具调用</text>
    <g font-family="Inter, sans-serif" font-size="13" font-weight="700">
      <rect x="24" y="124" width="68" height="34" rx="7" fill="#ffffff"/><text x="41" y="146" fill="#6d3fc0">MEASURE</text>
      <rect x="104" y="124" width="58" height="34" rx="7" fill="#ffffff"/><text x="122" y="146" fill="#9a6b00">FLY</text>
      <rect x="174" y="124" width="62" height="34" rx="7" fill="#ffffff"/><text x="188" y="146" fill="#b3261e">WAIT</text>
    </g>
  </g>
  <path d="M1038 254 H1086" stroke="#6d3fc0" stroke-width="3" marker-end="url(#m-violet)"/>

  <g transform="translate(1098 158)">
    <rect width="300" height="190" rx="14" fill="#fbf1dc" stroke="#9a6b00" stroke-width="2"/>
    <text x="24" y="34" fill="#9a6b00" font-family="ui-monospace, monospace" font-size="12" font-weight="700">ACTION</text>
    <text x="24" y="70" fill="#1a2233" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">规划与安全检查</text>
    <text x="24" y="103" fill="#4a5672" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14">candidate routes</text>
    <text x="24" y="128" fill="#4a5672" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14">净空 · 空速 · 推力 · 电量</text>
    <rect x="24" y="145" width="250" height="25" rx="6" fill="#ffffff" opacity=".82"/>
    <text x="36" y="162" fill="#9a6b00" font-family="Inter, sans-serif" font-size="12">route / no-go / replan</text>
  </g>

  <text x="72" y="410" fill="#1a2233" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">主动测量不是旁路模块，而是 belief update 的动作</text>
  <text x="72" y="438" fill="#5a6478" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="14">只有当读数可能改变候选排序或安全判断时，才支付测量与绕路成本。</text>

  <g transform="translate(72 480)">
    <rect width="500" height="230" rx="14" fill="#ffffff" stroke="#dde3ee" stroke-width="2"/>
    <rect x="0" y="0" width="500" height="230" rx="14" fill="url(#method-grid)" opacity=".65"/>
    <text x="24" y="34" fill="#b3261e" font-family="ui-monospace, monospace" font-size="12" font-weight="700">ACTIVE SENSING</text>
    <text x="24" y="70" fill="#1a2233" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">测量候选之间的差异</text>
    <g fill="#c4cad6" stroke="#9aa3b5" stroke-width="2">
      <rect x="230" y="88" width="76" height="62" rx="4"/><rect x="328" y="112" width="54" height="38" rx="4"/>
    </g>
    <path d="M34 180 C120 180 140 102 220 102 C262 102 288 180 372 180 C412 180 440 164 468 150" fill="none" stroke="#2456d6" stroke-width="4"/>
    <path d="M34 180 C120 180 148 212 220 212 C264 212 290 180 372 180 C412 180 440 164 468 150" fill="none" stroke="#6d3fc0" stroke-width="4" stroke-dasharray="8 7"/>
    <circle cx="184" cy="102" r="8" fill="#b3261e" stroke="#ffffff" stroke-width="3"/>
    <text x="160" y="82" fill="#b3261e" font-family="Inter, sans-serif" font-size="12" font-weight="700">probe</text>
    <text x="24" y="214" fill="#2456d6" font-family="Inter, sans-serif" font-size="12">candidate A</text>
    <text x="384" y="214" fill="#6d3fc0" font-family="Inter, sans-serif" font-size="12">candidate B</text>
  </g>

  <g transform="translate(618 480)">
    <rect width="410" height="230" rx="14" fill="#ffffff" stroke="#dde3ee" stroke-width="2"/>
    <text x="24" y="34" fill="#6d3fc0" font-family="ui-monospace, monospace" font-size="12" font-weight="700">BELIEF UPDATE</text>
    <text x="24" y="70" fill="#1a2233" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">读数进入下一次决策</text>
    <g transform="translate(24 96)">
      <rect width="160" height="76" rx="10" fill="#e5edff"/><text x="16" y="29" fill="#2456d6" font-family="Inter, sans-serif" font-size="13" font-weight="700">PRIOR</text><text x="16" y="55" fill="#4a5672" font-family="Inter, sans-serif" font-size="12">mean + uncertainty</text>
      <path d="M176 38 H210" stroke="#6d3fc0" stroke-width="3" marker-end="url(#m-violet)"/>
      <rect x="226" width="160" height="76" rx="10" fill="#efe7fb"/><text x="242" y="29" fill="#6d3fc0" font-family="Inter, sans-serif" font-size="13" font-weight="700">POSTERIOR</text><text x="242" y="55" fill="#4a5672" font-family="Inter, sans-serif" font-size="12">updated route belief</text>
    </g>
    <text x="24" y="205" fill="#5a6478" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13">measurement cost + decision value</text>
  </g>

  <path d="M1230 710 C1300 710 1380 680 1380 590 L1380 380" fill="none" stroke="#b3261e" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#m-red)"/>
  <text x="1300" y="738" text-anchor="middle" fill="#b3261e" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">CFD replay：失败率 · 不飞率 · regret · 测风成本</text>
  <path d="M1070 480 C1070 410 990 380 884 348" fill="none" stroke="#6d3fc0" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#m-violet)"/>
  <text x="1042" y="424" text-anchor="end" fill="#6d3fc0" font-family="Inter, sans-serif" font-size="12">replan after measurement</text>
</svg>
